[project]
site_name        = "open-inspector"
site_description = "A modern, OpenTofu-aware inspector for Terraform/OpenTofu configurations."
site_author      = "The open-inspector authors"
site_url         = "https://remoterabbit.github.io/open-inspector/"
repo_url         = "https://github.com/remoterabbit/open-inspector"
repo_name        = "remoterabbit/open-inspector"
copyright        = "Copyright &copy; 2026 The open-inspector authors"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "CLI reference" = [
    { "Overview" = "cli/open-inspector.md" },
    { "config" = "cli/open-inspector_config.md" },
    { "graph" = "cli/open-inspector_graph.md" },
    { "modules" = "cli/open-inspector_modules.md" },
  ] },
  { "JSON schema (v1)" = "schema/v1.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.instant",
  "navigation.sections",
  "navigation.footer",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
scheme      = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/remoterabbit/open-inspector"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
